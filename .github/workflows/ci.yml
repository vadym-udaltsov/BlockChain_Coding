name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run tests with Allure
        run: npx hardhat test
        continue-on-error: true
      - name: Download previous Allure history
        run: |
          git fetch origin gh-pages || true
          git checkout origin/gh-pages -- allure/history || true
          mkdir -p allure-results/history
          cp -r allure/history/* allure-results/history/ || true
      - name: Generate Allure report
        run: |
          npx allure generate allure-results --clean -o allure-report
      - name: Prune Allure history to last 20 runs
        run: bash .github/workflows/prune_allure_history.sh
      - name: Gzip Allure report JSON/XML files
        run: |
          find allure-report -type f \( -name '*.json' -o -name '*.xml' \) -exec gzip -9 {} \;
          find allure-report -type f -name '*.gz' -exec bash -c 'mv "$0" "${0%.gz}"' {} \;
      - name: Upload Allure report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
      - name: Run solidity-coverage
        run: npx hardhat coverage
        continue-on-error: true
      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
      - name: Deploy Allure report to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: allure
          keep_files: true
      - name: Deploy coverage report to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: coverage
          destination_dir: coverage
          keep_files: true
      - name: Deploy index.html redirect to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          destination_dir: .
          keep_files: true
      - name: Clean up temp files
        run: rm -rf allure/history allure-results/history || true
      - name: Add Allure Report link to summary
        run: |
          echo "### 🧪 [Allure Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/)" >> $GITHUB_STEP_SUMMARY

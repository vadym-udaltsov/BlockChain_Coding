name: Hardhat Coverage & Allure Report

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Hardhat coverage
        run: npx hardhat coverage

      - name: Generate Allure report
        run: |
          npx allure generate allure-results --clean -o allure-report

      - name: Prepare gh-pages content
        run: |
          TIMESTAMP=$(date +"%Y%m%d-%H%M%S")
          RUN_DIR="reports/run-$TIMESTAMP"
          mkdir -p "$RUN_DIR"
          cp -r allure-report/* "$RUN_DIR/"
          # Keep only the last 20 runs
          mkdir -p reports
          ls -dt reports/run-* | tail -n +21 | xargs -r rm -rf
          # Generate index.html
          echo '<html><head><title>Allure Reports History</title></head><body><h1>Last 20 runs</h1><ul>' > index.html
          for d in $(ls -dt reports/run-* | head -n 20); do
            DT=$(echo $d | sed 's/reports\/run-//')
            echo "<li><a href='$d/index.html'>Run $DT</a></li>" >> index.html
          done
          echo '</ul></body></html>' >> index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: true

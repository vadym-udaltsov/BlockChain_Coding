name: Hardhat Coverage & Allure Report

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * *'

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Hardhat coverage
        run: npx hardhat coverage
        continue-on-error: true

      - name: Generate Allure report
        run: |
          npx allure generate allure-results --clean -o allure-report

      - name: Prepare Allure history
        run: |
          TIMESTAMP=$(date +"%Y%m%d-%H%M%S")
          HISTORY_DIR="allure-history/run-$TIMESTAMP"
          mkdir -p "$HISTORY_DIR"
          cp -r allure-results/* "$HISTORY_DIR/"
          # Keep only last 20 runs
          mkdir -p allure-history
          ls -dt allure-history/run-* | tail -n +21 | xargs -r rm -rf
          # Copy last run's history for Allure trend
          LAST_HISTORY=$(ls -dt allure-history/run-* | head -n 1)
          if [ -d "$LAST_HISTORY/history" ]; then
            mkdir -p allure-results/history
            cp -r "$LAST_HISTORY/history/." allure-results/history/
          fi

      - name: Generate Allure report
        run: |
          npx allure generate allure-results --clean -o allure-report

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
          keep_files: false

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: true
